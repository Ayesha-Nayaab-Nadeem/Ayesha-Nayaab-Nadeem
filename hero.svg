<title id="t">Software Engineer and Creative Designer. Issue 01, Vol. 01, 2026.</title><desc id="d">Magazine-style cover. Giant serif words SOFTWARE and ENGINEER, with + CREATIVE DESIGNER, the monogram A / Y, the name as a signature, and a status line: currently building.</desc>
<defs><style>.serif{font-family:'Bodoni 72','Bodoni MT',Didot,'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}.sans{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,sans-serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;letter-spacing:.08em}</style><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.23 0 0 0 0 0.14 0 0 0 0 0.09 .22 0 0 0 -.02"/></filter><linearGradient id="folds" x1="0" y1="0" x2=".16" y2=".008" spreadMethod="repeat"><stop offset="0" stop-color="#2E050D"/><stop offset=".3" stop-color="#7A1A2D"/><stop offset=".5" stop-color="#5C0F1E"/><stop offset=".8" stop-color="#3A0811"/><stop offset="1" stop-color="#2E050D"/></linearGradient><linearGradient id="folds2" x1="0" y1="0" x2=".093" y2="-.006" spreadMethod="repeat"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".45" stop-color="#9B2A40" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient></defs>
