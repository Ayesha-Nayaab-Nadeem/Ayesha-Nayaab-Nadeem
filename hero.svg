roke="#3B2418" stroke-width="0.75" opacity="1"/><circle cx="40" cy="774" r="4" fill="#D7161F"/><text x="54" y="778" class="mono" font-size="13" fill="#110E0D" text-anchor="start" >CURRENTLY BUILDING</text><text x="36" y="880" class="serif" font-size="26" fill="#3B2418" text-anchor="start" font-style="italic">Systems with</text><text x="36" y="912" class="serif" font-size="26" fill="#3B2418" text-anchor="start" font-style="italic">a point of view.</text><rect x="420" y="764" width="344" height="250" fill="url(#folds)"/><rect x="420" y="764" width="344" height="250" fill="url(#folds2)"/><rect x="420" y="764" width="344" height="250" fill="url(#shade)"/><line x1="704" y1="764" x2="704" y2="1014" stroke="#D7161F" stroke-width="1"/><text x="420" y="1034" class="mono" font-size="11" fill="#3B2418" text-anchor="start" >FIG. 01. BURGUNDY, DRAPED.</text><text transform="translate(18,720) rotate(-90)" class="mono" font-size="11" fill="#3B2418" opacity=".45">VOL. 01 — 2026</text><line x1="36" y1="1052" x2="764" y2="1052" stroke="#3B2418" stroke-width="0.75" opacity="1"/><text x="36" y="1076" class="mono" font-size="11" fill="#3B2418" text-anchor="start" >© 2026</text><text x="764" y="1076" class="mono" font-size="11" fill="#D7161F" text-anchor="end" >01</text>
