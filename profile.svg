<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 812" width="800" height="812" role="img" aria-labelledby="t d">
<title id="t">Profile 01. The person behind the interface.</title><desc id="d">Software engineer and creative designer. Engineering decides how a thing works; design decides how it feels. Based: [CITY, COUNTRY]. Focus: [FOCUS AREA]. Discipline: engineering × design. Status: building.</desc>
<defs><style>.serif{font-family:'Bodoni 72','Bodoni MT',Didot,'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}.sans{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,sans-serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;letter-spacing:.08em}</style><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.23 0 0 0 0 0.14 0 0 0 0 0.09 .22 0 0 0 -.02"/></filter></defs>
<rect width="800" height="812" fill="#F3ECDD"/>
<text x="36" y="40" class="mono" font-size="12" fill="#3B2418" text-anchor="start" >PROFILE / 01</text><text x="764" y="40" class="mono" font-size="12" fill="#3B2418" text-anchor="end" >NO. 001</text><line x1="36" y1="56" x2="764" y2="56" stroke="#3B2418" stroke-width="0.75" opacity="1"/><text x="36" y="170" class="serif" font-size="70" fill="#110E0D" text-anchor="start" textLength="340" lengthAdjust="spacingAndGlyphs" >The person</text><text x="36" y="246" class="serif" font-size="70" fill="#110E0D" text-anchor="start" textLength="340" lengthAdjust="spacingAndGlyphs" >behind the</text><text x="36" y="322" class="serif" font-size="70" fill="#5C0F1E" text-anchor="start" textLength="340" lengthAdjust="spacingAndGlyphs" font-style="italic">interface.</text><text x="36" y="362" class="mono" font-size="11" fill="#3B2418" text-anchor="start" >(SELF-PORTRAIT, WITHOUT THE FACE)</text><text x="30" y="720" class="serif" font-size="300" fill="none" text-anchor="start" font-style="italic" stroke="#3B2418" stroke-width="1">&amp;</text><text x="440" y="134" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >[NAME] is a software engineer</text><text x="440" y="161" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >and creative designer. Their</text><text x="440" y="188" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >work sits where systems meet</text><text x="440" y="215" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >style: interfaces that are</text><text x="440" y="242" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >structurally sound and visually</text><text x="440" y="269" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >deliberate.</text><text x="440" y="323" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >Engineering decides how a thing</text><text x="440" y="350" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >works. Design decides how it</text><text x="440" y="377" class="sans" font-size="17" fill="#110E0D" text-anchor="start" >feels. [NAME] insists on both.</text><text x="440" y="450" class="mono" font-size="11" fill="#3B2418" text-anchor="start" >[ONE HONEST SENTENCE ABOUT</text><text x="440" y="468" class="mono" font-size="11" fill="#3B2418" text-anchor="start" > YOUR BACKGROUND.]</text><line x1="440" y1="534" x2="764" y2="534" stroke="#3B2418" stroke-width="0.5" opacity="0.8"/><text x="440" y="560" class="mono" font-size="12" fill="#3B2418" text-anchor="start" >BASED</text><text x="552" y="560" class="mono" font-size="13" fill="#110E0D" text-anchor="start" >[CITY, COUNTRY]</text><line x1="440" y1="578" x2="764" y2="578" stroke="#3B2418" stroke-width="0.5" opacity="0.8"/><text x="440" y="604" class="mono" font-size="12" fill="#3B2418" text-anchor="start" >FOCUS</text><text x="552" y="604" class="mono" font-size="13" fill="#110E0D" text-anchor="start" >[FOCUS AREA]</text><line x1="440" y1="622" x2="764" y2="622" stroke="#3B2418" stroke-width="0.5" opacity="0.8"/><text x="440" y="648" class="mono" font-size="12" fill="#3B2418" text-anchor="start" >DISCIPLINE</text><text x="552" y="648" class="mono" font-size="13" fill="#110E0D" text-anchor="start" >ENGINEERING × DESIGN</text><line x1="440" y1="666" x2="764" y2="666" stroke="#3B2418" stroke-width="0.5" opacity="0.8"/><text x="440" y="692" class="mono" font-size="12" fill="#3B2418" text-anchor="start" >STATUS</text><circle cx="552" cy="688" r="3.5" fill="#D7161F"/><text x="566" y="692" class="mono" font-size="13" fill="#110E0D" text-anchor="start" >BUILDING</text><line x1="36" y1="760" x2="764" y2="760" stroke="#3B2418" stroke-width="0.75" opacity="1"/><text x="36" y="784" class="mono" font-size="11" fill="#3B2418" text-anchor="start" >PROFILE</text><text x="764" y="784" class="mono" font-size="11" fill="#D7161F" text-anchor="end" >03</text>
