<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="t d">
<title id="t">Code has aesthetics.</title><desc id="d">Engineering gives the system structure. Design gives it character. const work = structure + character;</desc>
<defs><style>.serif{font-family:'Bodoni 72','Bodoni MT',Didot,'Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}.sans{font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,sans-serif}.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace;letter-spacing:.08em}</style><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.8 .22 0 0 0 -.02"/></filter></defs>
<rect width="800" height="940" fill="#110E0D"/>
<text x="36" y="40" class="mono" font-size="12" fill="#CBBFA8" text-anchor="start" >CODE × DESIGN</text><text x="764" y="40" class="mono" font-size="12" fill="#CBBFA8" text-anchor="end" >MANIFESTO / NO. 004</text><line x1="36" y1="56" x2="764" y2="56" stroke="#CBBFA8" stroke-width="0.5" opacity="0.4"/><text x="36" y="236" class="serif" font-size="210" fill="#F3ECDD" text-anchor="start" textLength="560" lengthAdjust="spacingAndGlyphs" >CODE</text><text x="424" y="396" class="serif" font-size="160" fill="none" text-anchor="start" textLength="340" lengthAdjust="spacingAndGlyphs" font-style="italic" stroke="#F3ECDD" stroke-width="1.3">HAS</text><text x="36" y="540" class="serif" font-size="124" fill="#F3ECDD" text-anchor="start" textLength="690" lengthAdjust="spacingAndGlyphs" >AESTHETICS</text><circle cx="750" cy="528" r="12" fill="#D7161F"/><line x1="36" y1="592" x2="764" y2="592" stroke="#CBBFA8" stroke-width="0.5" opacity="0.5"/><text x="36" y="652" class="serif" font-size="30" fill="#F3ECDD" text-anchor="start" font-style="italic">Engineering gives the</text><text x="36" y="690" class="serif" font-size="30" fill="#F3ECDD" text-anchor="start" font-style="italic">system structure.</text><text x="424" y="652" class="serif" font-size="30" fill="#B03A4D" text-anchor="start" font-style="italic">Design gives it</text><text x="424" y="690" class="serif" font-size="30" fill="#B03A4D" text-anchor="start" font-style="italic">character.</text><text x="36" y="770" class="sans" font-size="16" fill="#CBBFA8" text-anchor="start" >Good software is arranged, not assembled. Every API has a rhythm. Every</text><text x="36" y="795" class="sans" font-size="16" fill="#CBBFA8" text-anchor="start" >interface has a voice. The best work is the kind where you cannot see the</text><text x="36" y="820" class="sans" font-size="16" fill="#CBBFA8" text-anchor="start" >seam between the engineering and the design.</text><text x="36" y="858" class="mono" font-size="14" fill="#CBBFA8" text-anchor="start" textLength="330" lengthAdjust="spacing">const work = structure + character;</text><rect x="372" y="845" width="8" height="16" fill="#D7161F"/><line x1="36" y1="888" x2="764" y2="888" stroke="#CBBFA8" stroke-width="0.75" opacity=".4"/><text x="36" y="912" class="mono" font-size="11" fill="#CBBFA8" text-anchor="start" >SYSTEMS</text><text x="764" y="912" class="mono" font-size="11" fill="#D7161F" text-anchor="end" >11</text>
<rect width="800" height="940" filter="url(#g)"/>
</svg>
